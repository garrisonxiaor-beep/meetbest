# Managed by fitness-site. Initial HTTP preview on the user-owned server.
# Add the user's domain and its certificate when DNS/TLS are ready.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.108.251.149;
    server_tokens off;

    access_log /var/log/nginx/fitness-site.access.log main;
    error_log /var/log/nginx/fitness-site.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 1m;
    }
}
