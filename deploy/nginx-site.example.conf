# Reference only. deploy/install.sh does NOT install this file.
# Current deployment: distro Nginx, /etc/nginx/conf.d/fitness-site.conf.
# Verify there is no other default_server before using this exact block.
# Later add the verified domain to server_name and configure HTTPS separately.
# If using BaoTa for a different deployment, merge only the location block into
# that website's server block and keep BaoTa's certificate/ACME settings.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.108.251.149;

    # Proxy only to the loopback application. Never expose /var/lib/fitness-site
    # or /opt/fitness-site as a web root.
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 1m;
    }
}
